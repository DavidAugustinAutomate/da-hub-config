services:
  nextcloud-db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=<ENTFERNT>
      - MYSQL_PASSWORD=<ENTFERNT>
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  nextcloud:
    image: nextcloud:30
    container_name: nextcloud
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - nextcloud-db
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=<ENTFERNT>
      - NEXTCLOUD_ADMIN_USER=david
      - NEXTCLOUD_ADMIN_PASSWORD=<ENTFERNT>
      - NEXTCLOUD_TRUSTED_DOMAINS=100.93.33.0
      - OVERWRITEHOST=100.93.33.0:8080
      - OVERWRITEPROTOCOL=http

volumes:
  nextcloud_db:
  nextcloud_data:
