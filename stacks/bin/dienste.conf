# Dienste fuer dahub-update.sh – eine Zeile pro Dienst, durch Leerzeichen getrennt.
# dienst: Containername = Service-Name in der Compose-Datei
# linie:  erlaubte Tags fuer automatische Updates (Regex); "-" = nur mit --version
# gruppe: auto | freigabe
# test:   Funktion in dahub-update.sh
# repo:   Datei im Repo da-hub-config
#
# dienst        stack-verzeichnis           image                                     linie             gruppe    test           repo
gotenberg       ~/stacks/gotenberg          gotenberg/gotenberg                       ^8\.\d+\.\d+$     auto      t_gotenberg    compose/gotenberg-stack.yml
ntfy            ~/stacks/ntfy               binwiederhier/ntfy                        ^v2\.\d+\.\d+$    auto      t_ntfy         compose/ntfy-stack.yml
docling         ~/stacks/wissensdatenbank   ghcr.io/docling-project/docling-serve     ^v1\.\d+\.\d+$    auto      t_docling      compose/verarbeitung-stack.yml
ollama          ~/stacks/wissensdatenbank   ollama/ollama                             ^0\.33\.\d+$      auto      t_ollama       compose/verarbeitung-stack.yml
libreoffice     ~/stacks/wissensdatenbank   libreofficedocker/libreoffice-unoserver   ^3\.19$           auto      t_libreoffice  compose/verarbeitung-stack.yml
nextcloud-db    ~/stacks/nextcloude         mariadb                                   ^11\.4\.\d+$      auto      t_nextcloud    compose/nextcloud-stack.yml
nextcloud       ~/stacks/nextcloude         nextcloud                                 ^33\.\d+\.\d+$    auto      t_nextcloud    compose/nextcloud-stack.yml
n8n             ~/stacks/n8n                docker.n8n.io/n8nio/n8n                   -                 freigabe  t_n8n          compose/n8n-stack.yml
litellm         ~/litellm                   ghcr.io/berriai/litellm                   -                 freigabe  t_litellm      compose/litellm-stack.yml
